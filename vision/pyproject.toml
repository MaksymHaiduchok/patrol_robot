[project]
name = "vision"
version = "0.1.0"
description = "Patrol Robot: computer vision service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
