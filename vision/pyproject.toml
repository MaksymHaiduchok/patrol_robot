[project]
name = "vision"
version = "0.1.0"
description = "Patrol Robot: computer vision service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "ultralytics>=8.4.207",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
